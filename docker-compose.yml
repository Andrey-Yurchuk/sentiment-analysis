services:
  jupyter:
    build:
      context: .
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: sentiment-analysis
    container_name: sentiment-analysis
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ./notebooks:/app/notebooks
      - ./data:/app/data
